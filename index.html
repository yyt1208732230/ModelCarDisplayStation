<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f3f0" />
    <meta name="description" content="Laurence Model World — a private model car collection." />
    <title>Laurence Model World</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="experience" aria-label="Laurence Model World image gallery">
      <div class="ambient ambient--a" aria-hidden="true"></div>
      <div class="ambient ambient--b" aria-hidden="true"></div>
      <div class="grain" aria-hidden="true"></div>

      <div class="deck" aria-live="polite"></div>

      <button class="nav-zone nav-zone--previous" type="button" aria-label="Previous car model"></button>
      <button class="nav-zone nav-zone--next" type="button" aria-label="Next car model"></button>

      <p class="gesture-hint" aria-hidden="true">
        <span></span>
        Click or swipe
      </p>
    </main>

    <template id="card-template">
      <article class="card">
        <div class="card__chrome">
          <svg class="card__car" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5.2 11.2 6.7 7.8c.35-.8 1.15-1.3 2.02-1.3h6.56c.87 0 1.67.5 2.02 1.3l1.5 3.4" />
            <path d="M4.4 11.2h15.2c.77 0 1.4.63 1.4 1.4v3.65c0 .69-.56 1.25-1.25 1.25H4.25A1.25 1.25 0 0 1 3 16.25V12.6c0-.77.63-1.4 1.4-1.4Z" />
            <circle cx="7" cy="14.4" r="1.2" />
            <circle cx="17" cy="14.4" r="1.2" />
            <path d="M5 17.5v1M19 17.5v1" />
          </svg>

          <a class="card__link" href="https://diecast.ilovefuturemobility.org/" target="_blank" rel="noopener noreferrer" aria-label="Open Laurence Car World">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8 16 16 8M9 8h7v7" />
            </svg>
          </a>
        </div>

        <h1 class="card__title">Laurence Model World</h1>

        <figure class="card__media">
          <img alt="" draggable="false" />
          <div class="card__foil" aria-hidden="true"></div>
          <figcaption class="card__tag"></figcaption>
        </figure>

        <p class="card__caption">@2026 Collection Design</p>
      </article>
    </template>

    <noscript>This gallery requires JavaScript to display the collection.</noscript>
    <script src="./app.js"></script>
  </body>
</html>
